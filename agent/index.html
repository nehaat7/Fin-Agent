<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinAgent</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root { --bg:#f7f8fa; --panel:#fff; --text:#1c2230; --muted:#6b7385; --accent:#0f6fde; --border:#e2e5ec; --user:#e8f1fd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1218; --panel:#171b23; --text:#e6e9ef; --muted:#8d95a6; --accent:#5aa2ff; --border:#2a303c; --user:#1b2a40; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:820px; margin:0 auto; padding:16px; display:flex; flex-direction:column; height:100dvh; }
  header h1 { font-size:18px; margin:4px 0; } header p { margin:0 0 12px; color:var(--muted); font-size:13px; }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding-bottom:12px; }
  .msg { padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:var(--panel); overflow-x:auto; }
  .user { background:var(--user); align-self:flex-end; max-width:85%; }
  .msg table { border-collapse:collapse; margin:6px 0; } .msg th,.msg td { border:1px solid var(--border); padding:4px 8px; text-align:left; }
  details { margin-top:8px; color:var(--muted); font-size:12px; } pre { white-space:pre-wrap; word-break:break-word; margin:4px 0; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .chips button { border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:999px; padding:4px 10px; font-size:13px; cursor:pointer; }
  form { display:flex; gap:8px; } input { flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:15px; }
  form button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; } .err { color:#d33; }
</style>
</head>
<body>
<main>
  <header><h1>FinAgent</h1><p>Claude on Amazon Bedrock · tools served over MCP from AWS Lambda · data from Yahoo Finance (not investment advice)</p></header>
  <div id="log"></div>
  <div class="chips" id="chips"></div>
  <form id="f"><input id="q" placeholder="Ask about a stock, e.g. Compare NVDA and AMD over the last year" autocomplete="off"><button id="send">Send</button></form>
</main>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), send = document.getElementById('send');
const history = [];
const examples = ["What's Apple trading at and how does its P/E compare to Microsoft?",
  "Compare NVDA and AMD: 1-year return, volatility and max drawdown",
  "Summarize Tesla's last 4 quarters of revenue and net income",
  "What's the latest news on JPMorgan?"];
const chips = document.getElementById('chips');
examples.forEach(e => { const b = document.createElement('button'); b.type='button'; b.textContent=e; b.onclick=()=>{q.value=e; ask();}; chips.appendChild(b); });

function add(role, html) { const d = document.createElement('div'); d.className = 'msg ' + role; d.innerHTML = html; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md = s => (window.marked ? marked.parse(s) : '<pre>' + esc(s) + '</pre>');

async function ask() {
  const text = q.value.trim(); if (!text) return;
  q.value = ''; send.disabled = true; chips.style.display = 'none';
  add('user', esc(text)); history.push({role:'user', content:text});
  const pending = add('bot', '<em>Thinking and calling tools…</em>');
  try {
    const r = await fetch('chat', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({messages: history})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    history.push({role:'assistant', content:data.answer});
    let html = md(data.answer);
    if (data.trace && data.trace.length) {
      html += '<details><summary>' + data.trace.length + ' MCP tool call(s)</summary>' +
        data.trace.map(t => '<pre>' + (t.is_error ? '⚠️ ' : '') + esc(t.tool + ' ' + JSON.stringify(t.input)) + '</pre>').join('') + '</details>';
    }
    pending.innerHTML = html;
  } catch (e) { history.pop(); pending.innerHTML = '<span class="err">Error: ' + esc(String(e.message || e)) + '</span>'; }
  send.disabled = false; q.focus();
}
document.getElementById('f').onsubmit = e => { e.preventDefault(); ask(); };
</script>
</body>
</html>
